<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EQUIS · Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0f12;color:#edf1f5;font:15px system-ui, sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px}h1{letter-spacing:.18em}p,.muted{color:#aeb7c1}.panel,.order{background:#171c21;border:1px solid #343c45;border-radius:14px;padding:18px;margin:14px 0}input,button,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #59636e;background:#0d1115;color:#fff}button{cursor:pointer;background:#dce2e8;color:#10151a;font-weight:700}button:disabled{opacity:.5} .row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:200px}.order h3{margin:0 0 8px}.meta{color:#aeb7c1;font-size:13px;line-height:1.7}.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.error{color:#ffb2a8}.good{color:#9be0b0}a{color:#dce2e8}
</style></head><body><main class="wrap"><a href="/">← EQUIS website</a><h1>EQUIS ADMIN</h1><p>Private order-request dashboard. Keep the admin token secret and only share access with an authorised adult account holder.</p><section class="panel"><div class="row"><input id="token" type="password" autocomplete="off" placeholder="Admin access token"><button id="load">Load requests</button></div><p id="message" class="muted">Enter your admin token to view requests.</p></section><section id="orders"></section></main><script>
const $=id=>document.getElementById(id);let token='';
async function request(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','x-admin-token':token},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){token=$('token').value.trim();if(!token){$('message').textContent='Enter your admin token.';return}$('message').textContent='Loading…';$('orders').innerHTML='';try{const rows=await request('/api/orders');$('message').textContent=rows.length+' request(s)';$('orders').innerHTML=rows.map(o=>`<article class="order"><h3>${esc(o.customer_name)} · ${esc(o.request_type==='order_request'?'Order request':'Enquiry')}</h3><div class="meta">${esc(o.created_at)}<br>Business: ${esc(o.business_name)} · Email: ${esc(o.email)} · Phone: ${esc(o.phone)}<br>Delivery: ${esc(o.delivery_area)} · Bottle: ${esc(o.bottle_size)} · Quantity: ${esc(o.estimated_quantity)}<br>Details: ${esc(o.request_details)}</div><div class="status"><label>Status <select data-id="${esc(o.id)}"><option ${o.status==='new'?'selected':''}>new</option><option ${o.status==='reviewing'?'selected':''}>reviewing</option><option ${o.status==='approved'?'selected':''}>approved</option><option ${o.status==='rejected'?'selected':''}>rejected</option><option ${o.status==='completed'?'selected':''}>completed</option></select></label><button data-save="${esc(o.id)}">Save status</button></div></article>`).join('')||'<p class="muted">No requests yet.</p>';document.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',async()=>{const id=b.dataset.save;const status=document.querySelector(`select[data-id="${CSS.escape(id)}"]`).value;b.disabled=true;try{await request('/api/orders','PATCH',{id,status});$('message').textContent='Status updated.'}catch(e){$('message').textContent=e.message}finally{b.disabled=false}}))}catch(e){$('message').textContent=e.message;$('message').className='error'}}
$('load').addEventListener('click',load);
</script></body></html>
